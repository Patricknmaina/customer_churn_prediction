[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = [
  "api/**",
  "scripts/**",
  "artifacts/**",
  "pyproject.toml",
  "uv.lock",
  "Dockerfile",
  "Dockerfile.api"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
