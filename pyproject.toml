[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "0.2.0"
description = "SyriaTel Customer Churn Prediction - ML model with API and dashboard"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Patrick Maina", email = "patrickmaina364@gmail.com"}
]
dependencies = [
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "fonttools==4.58.1",
    "imbalanced-learn==0.13.0",
    "imblearn==0.0",
    "joblib==1.5.1",
    "kiwisolver==1.4.8",
    "matplotlib==3.10.3",
    "narwhals==1.41.0",
    "numpy==2.2.6",
    "packaging==25.0",
    "pandas==2.2.3",
    "patsy==1.0.1",
    "pillow==11.2.1",
    "plotly==6.1.2",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "six==1.17.0",
    "sklearn-compat==0.1.3",
    "statsmodels==0.14.4",
    "threadpoolctl==3.6.0",
    "tzdata==2025.2",
    "xgboost==3.0.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.0",
    "shap>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
train = "scripts.modeling.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "api*", "streamlit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that take more than a few seconds",
    "integration: marks integration tests needing multiple components",
]
